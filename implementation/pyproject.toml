[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-research-harness"
version = "0.1.0"
description = "Evidence-gated medical research harness; no clinical models included"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "claude-agent-sdk==0.2.152"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
medical-harness = "medical_harness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=runtime/pytest-temp"

[tool.setuptools.packages.find]
where = ["src"]
